<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baptlink Wallet</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f13;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: #1a1a22;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo h1 {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(90deg, #7c5cff, #00d4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo p { color: #888; font-size: 13px; margin-top: 4px; }
    .card {
      background: #121218;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .label { font-size: 12px; color: #888; margin-bottom: 6px; }
    .address {
      font-family: monospace;
      font-size: 14px;
      word-break: break-all;
      color: #00d4ff;
    }
    .balance {
      font-size: 28px;
      font-weight: 700;
      margin-top: 8px;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
      transition: 0.2s;
    }
    .btn-primary {
      background: linear-gradient(90deg, #7c5cff, #5a3fff);
      color: white;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary {
      background: #2a2a35;
      color: #e8e8e8;
    }
    .btn-danger {
      background: #3a1a1a;
      color: #ff6b6b;
    }
    textarea, input {
      width: 100%;
      background: #121218;
      border: 1px solid #2a2a35;
      border-radius: 10px;
      padding: 12px;
      color: #e8e8e8;
      font-size: 14px;
      margin-bottom: 12px;
      resize: vertical;
    }
    .hidden { display: none; }
    .warning {
      background: #2a1a00;
      color: #ffb74d;
      font-size: 12px;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .seed-box {
      background: #1a1a00;
      border: 1px solid #5a4a00;
      color: #ffd54f;
      font-family: monospace;
      font-size: 13px;
      padding: 12px;
      border-radius: 10px;
      word-break: break-all;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>Baptlink Wallet</h1>
      <p>Non-custodial • Web</p>
    </div>

    <!-- Écran d'accueil -->
    <div id="home">
      <div class="warning">
        ⚠️ Ce wallet est éducatif. Ne mets jamais de gros montants. Ta seed phrase = ton argent. Ne la partage jamais.
      </div>
      <button class="btn-primary" onclick="createWallet()">Créer un nouveau wallet</button>
      <button class="btn-secondary" onclick="showImport()">Importer un wallet</button>
    </div>

    <!-- Création -->
    <div id="create" class="hidden">
      <div class="warning">Note ces 12 mots dans un endroit sûr. C’est la seule façon de récupérer ton wallet.</div>
      <div class="seed-box" id="seedPhrase"></div>
      <button class="btn-primary" onclick="confirmCreate()">J’ai noté ma seed phrase</button>
      <button class="btn-secondary" onclick="backHome()">Retour</button>
    </div>

    <!-- Import -->
    <div id="import" class="hidden">
      <textarea id="importInput" rows="3" placeholder="Colle ta seed phrase (12 ou 24 mots) ou ta clé privée"></textarea>
      <button class="btn-primary" onclick="importWallet()">Importer</button>
      <button class="btn-secondary" onclick="backHome()">Retour</button>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
      <div class="card">
        <div class="label">Adresse</div>
        <div class="address" id="address"></div>
      </div>
      <div class="card">
        <div class="label">Solde (ETH - réseau principal)</div>
        <div class="balance" id="balance">—</div>
      </div>
      <button class="btn-secondary" onclick="copyAddress()">Copier l’adresse</button>
      <button class="btn-secondary" onclick="refreshBalance()">Actualiser le solde</button>
      <button class="btn-danger" onclick="logout()">Déconnecter</button>
    </div>
  </div>

  <script>
    let wallet = null;
    const provider = new ethers.JsonRpcProvider("https://eth.llamarpc.com");

    function show(id) {
      ["home", "create", "import", "dashboard"].forEach(el => {
        document.getElementById(el).classList.add("hidden");
      });
      document.getElementById(id).classList.remove("hidden");
    }

    function backHome() { show("home"); }

    function createWallet() {
      wallet = ethers.Wallet.createRandom();
      document.getElementById("seedPhrase").innerText = wallet.mnemonic.phrase;
      show("create");
    }

    function confirmCreate() {
      showDashboard();
    }

    function showImport() {
      show("import");
    }

    function importWallet() {
      const input = document.getElementById("importInput").value.trim();
      try {
        if (input.includes(" ")) {
          wallet = ethers.Wallet.fromPhrase(input);
        } else {
          wallet = new ethers.Wallet(input);
        }
        showDashboard();
      } catch (e) {
        alert("Seed phrase ou clé privée invalide");
      }
    }

    async function showDashboard() {
      document.getElementById("address").innerText = wallet.address;
      show("dashboard");
      refreshBalance();
    }

    async function refreshBalance() {
      try {
        const bal = await provider.getBalance(wallet.address);
        document.getElementById("balance").innerText = ethers.formatEther(bal).slice(0, 8) + " ETH";
      } catch (e) {
        document.getElementById("balance").innerText = "Erreur réseau";
      }
    }

    function copyAddress() {
      navigator.clipboard.writeText(wallet.address);
      alert("Adresse copiée !");
    }

    function logout() {
      wallet = null;
      show("home");
    }
  </script>
</body>
                                                                                                                </html>
